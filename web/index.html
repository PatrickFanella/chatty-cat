<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="Chatty Cat"><meta property="og:description" content="Self-hosted Twitch chat client. Six merged channels, your display settings."><meta property="og:image" content="https://chat.subcult.tv/og.png"><meta name="twitter:card" content="summary_large_image">
  <title>Chatty Cat — Self-hosted Twitch chat client</title>
  <meta name="description" content="Self-hosted Twitch chat client. Six merged channels, your display settings.">
  <link rel="canonical" href="https://chat.subcult.tv/">
  <meta property="og:url" content="https://chat.subcult.tv/">
  <link rel="stylesheet" href="/seo.css">
</head>
<body>
  <header><button id="header-min" data-short="↕" type="button" aria-label="Cycle header: full, strip, graph">Header ↕</button>
    <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges"><path class="cat-face" d="M2 2h2.02v2.02h-2.02zM20 2h2.02v2.02h-2.02zM2 4h2.02v2.02h-2.02zM4 4h2.02v2.02h-2.02zM18 4h2.02v2.02h-2.02zM20 4h2.02v2.02h-2.02zM2 6h2.02v2.02h-2.02zM4 6h2.02v2.02h-2.02zM6 6h2.02v2.02h-2.02zM16 6h2.02v2.02h-2.02zM18 6h2.02v2.02h-2.02zM20 6h2.02v2.02h-2.02zM2 8h20.02v2.02h-20.02zM2 10h20.02v2.02h-20.02zM2 12h2.02v2.02h-2.02zM8 12h8.02v2.02h-8.02zM20 12h2.02v2.02h-2.02zM2 14h20.02v2.02h-20.02zM2 16h8.02v2.02h-8.02zM14 16h8.02v2.02h-8.02zM4 18h16.02v2.02h-16.02zM6 20h12.02v2.02h-12.02z"/><path class="cat-cursor" d="M10 16h4.02v2.02h-4.02z"/></svg><h1 class="brand-title">Chatty Cat</h1></div>
    <form id="channels"><label for="channel">Channels</label><input id="channel" name="channel" autocomplete="off" spellcheck="false" maxlength="155"><button>Join</button></form>
    <span id="status" role="status">Connecting…</span>
    <button id="theme" type="button" aria-label="Toggle light theme">◐</button>
    <button id="login" type="button" disabled>Log in with Twitch</button>
    <span id="account" role="status"></span><span id="personal-status" role="status"></span><span id="account-emotes" role="status"></span>
    <button id="video-open" data-short="▶" type="button" aria-expanded="false" aria-controls="video-panel">Video</button><button id="whisper-open" data-short="✉" type="button" aria-controls="whisper-panel" aria-expanded="false" disabled>Whispers</button><button id="resources-open" data-short="?" type="button" aria-controls="resources-panel" aria-expanded="false">Help &amp; resources</button><button id="actions-open" type="button">Actions</button><button id="hotkeys-open" type="button">Shortcuts</button><button id="splits-open" type="button" aria-pressed="false">Independent panes</button><button id="workspace-open" type="button">Workspaces</button><button id="display-open" data-short="⚙" type="button">Settings</button><button id="stats-open" data-short="▥" type="button">Stats</button><span id="rate" aria-label="Message rate"></span>
    <button id="archive-open" data-short="⌕" type="button">Search archive</button>
    <button id="animation" data-short="❄" type="button" aria-pressed="false">Freeze emotes</button>
  <nav id="joined-channels" aria-label="Joined channels"></nav></header>
<div id="offline" role="status" hidden>Offline · Saved history remains available; live chat and sending require a connection.</div><button id="app-update" type="button" hidden>Update ready · Reload</button>
  <div id="stream" class="stream" aria-label="Stream information">Loading stream information…</div>
  <div id="room-state" class="stream" role="status" hidden></div>

  <main id="log" role="log" aria-label="Twitch chat" aria-live="off"></main>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <form id="composer" aria-label="Send Twitch chat message">
    <button id="picker-open" type="button" aria-expanded="false" aria-controls="emote-picker">Emotes</button><label for="send-channel">Send to</label><select id="send-channel" aria-label="Destination channel"></select>
    <div id="reply-target" hidden><span id="reply-label"></span><button id="cancel-reply" type="button">Cancel reply</button></div>
    <label class="sr-only" for="message">Message</label><textarea id="message" rows="1" aria-describedby="message-length send-status" aria-autocomplete="list" aria-controls="completions" aria-expanded="false" autocomplete="off" placeholder="Log in" disabled></textarea><div id="completions" role="listbox" aria-label="Nickname and emote completions" hidden></div>
    <span id="message-length">0/500</span><button id="send" type="submit" disabled>Send</button>
    <span id="send-status" role="status">Log in with Twitch to send messages</span>
  </form>

  <footer><button id="missed-mentions" type="button" hidden></button><span id="count">0 messages</span><button id="latest" hidden type="button">↓ Latest messages</button><a href="https://subcult.tv/support" title="Support SUBCULT, the studio maintaining Chatty Cat; separate from channel subscriptions and tips">Support SUBCULT</a><a id="source-download" href="/source.tar.gz">Source code (AGPL-3.0)</a></footer>
  <script type="module" src="/src/bootstrap.ts"></script>
</body>
</html>
