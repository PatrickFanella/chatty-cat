<dialog id="workspace-panel" aria-label="Named workspaces"><h2>Workspaces</h2><button data-workspace-action="close" type="button">Close</button><p>Save channels, send target, display and pane arrangement. Switching restores the saved view and keeps this tab’s channel drafts.</p><label>Saved workspace<select id="workspace-select"></select></label><label>Name<input id="workspace-name" maxlength="60" placeholder="Watching, Moderating or Community"></label><div><button type="button" data-workspace-action="create">Preview new</button><button type="button" data-workspace-action="save">Preview save</button><button type="button" data-workspace-action="rename">Preview rename</button><button type="button" data-workspace-action="duplicate">Preview duplicate</button><button type="button" data-workspace-action="switch">Preview switch</button><button type="button" data-workspace-action="delete">Preview delete</button></div><p id="workspace-status" role="status" aria-live="polite"></p><button id="workspace-apply" type="button" data-workspace-action="apply" disabled>Apply preview</button><hr><label>Import workspace JSON (256 KB maximum)<input id="workspace-file" type="file" accept=".json,application/json"></label><button type="button" data-workspace-action="export">Export workspaces</button><p>Workspace files contain public settings only. Account credentials, drafts and whispers are excluded.</p></dialog>
