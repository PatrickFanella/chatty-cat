name: Verify
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs only on main and gates the NUC deploy, so a newer push waits for the
  # running one instead of cancelling it.
  cancel-in-progress: false

jobs:
  go:
    name: Go race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
  web:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run format:check
      - run: npm --prefix web test -- --maxWorkers=2
      - run: npm --prefix web run build
      - name: Bundle budget and desktop navigation regressions
        run: node --test scripts/check-bundle-budgets.test.mjs scripts/desktop-player-login.test.mjs
      - name: Browser companion syntax and packaging
        run: |
          node --check companion/browser/core.js
          node --check companion/browser/background.js
          node --check companion/browser/popup.js
          node --check companion/browser/firefox-content.js
          python3 scripts/package-browser-companion.py /tmp/chatty-browser-companion.zip
          python3 scripts/package-browser-companion.py --browser firefox /tmp/chatty-firefox-companion.xpi
          python3 -m zipfile -e /tmp/chatty-firefox-companion.xpi /tmp/chatty-firefox-companion
          npx --yes web-ext@10.8.0 lint --source-dir /tmp/chatty-firefox-companion --warnings-as-errors
  deploy:
    name: Deploy to production
    needs: [go, web]
    # Only a push to main deploys. The key in NUC_DEPLOY_KEY can do nothing but run
    # NUC's fixed chatty-cat-autodeploy, which fetches main itself, requires these
    # checks to have passed on that commit and skips releases with no shipped change.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-latest, kvant]
    timeout-minutes: 30
    steps:
      - name: Run the guarded deploy on NUC
        env:
          NUC_DEPLOY_KEY: ${{ secrets.NUC_DEPLOY_KEY }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          NUC_HOST_KEY: '10.0.0.56 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDXG1FuUR5ues37EaZ25p6LtmOs9C5mcr3aVo9nAqU1Z'
        run: |
          : "${DEPLOY_TARGET:?DEPLOY_TARGET secret is not set}"
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$NUC_DEPLOY_KEY" > "$key"
          printf '%s\n' "$NUC_HOST_KEY" > "$hosts"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes "$DEPLOY_TARGET"
