name: Desktop
# Builds the Linux and macOS desktop apps, checks that each one starts its bundled
# server and renders live chat, and on main publishes them as a Gitea release.
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'companion/**'
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - '.go-version'
      - 'NOTICE.md'
      - 'LICENSE'
      - 'scripts/build-release.py'
      - 'scripts/build-desktop.py'
      - 'scripts/package-browser-companion.py'
      - 'scripts/build-chatthing-release.py'
      - 'scripts/chatthing-launcher.sh'
      - '.gitea/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs only on main and publishes a release, so a newer push waits for the
  # running one instead of cancelling it.
  cancel-in-progress: false

jobs:
  linux:
    name: Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Xvfb and Electron's libraries
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 \
            libxss1 libxtst6 >/dev/null
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - run: python3 scripts/build-desktop.py
      - name: Start the app and render live chat
        # The job runs as root, which Chromium's sandbox refuses.
        run: xvfb-run -a desktop/dist/linux-unpacked/chatty-cat --no-sandbox --smoke="$PWD/desktop/dist/smoke-linux.png"
      - uses: https://github.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, as Gitea lacks v4
        with:
          name: linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/smoke-linux.png
          if-no-files-found: error
  mac:
    name: macOS app
    runs-on: macos-arm64
    timeout-minutes: 30
    env:
      # The Mac runner runs jobs on the host with mise shims on PATH. A shim (python3,
      # node) exports GOROOT for mise's own Go, which breaks the Go from setup-go.
      MISE_GO_SET_GOROOT: 'false'
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - run: python3 scripts/build-desktop.py
        env:
          # electron-builder skips signing in pull requests unless told otherwise. The
          # ad-hoc identity uses no certificate or other secret.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check the ad-hoc signature
        run: codesign --verify --deep --strict "desktop/dist/mac-arm64/Chatty Cat.app"
      - name: Start the app and render live chat
        run: '"desktop/dist/mac-arm64/Chatty Cat.app/Contents/MacOS/Chatty Cat" --smoke="$PWD/desktop/dist/smoke-mac.png"'
      - uses: https://github.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, as Gitea lacks v4
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/smoke-mac.png
          if-no-files-found: error
  browser:
    name: Browser companions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Package Chromium and unsigned Firefox companions
        run: |
          mkdir browser-dist
          python3 scripts/package-browser-companion.py browser-dist/chatty-cat-chromium.zip
          python3 scripts/package-browser-companion.py --browser firefox browser-dist/chatty-cat-firefox-unsigned.xpi
      - uses: https://github.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: browser-companions
          path: browser-dist/*
          if-no-files-found: error
  chatthing:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm --prefix web ci --no-audit --no-fund
      - run: python3 scripts/build-chatthing-release.py chatthing-dist
      - name: Start the Linux build and serve the UI
        # BROWSER=echo prints the address the launcher would open.
        run: |
          set -eu
          mkdir smoke
          tar -xzf chatthing-dist/chatthing-*-linux-x64.tar.gz -C smoke
          cd smoke/chatthing-*-linux-x64
          BROWSER=echo ./chatty-cat > launcher.log 2>&1 &
          server=$!
          for _ in $(seq 150); do curl -fs -o /dev/null http://127.0.0.1:47830/api/ready && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:47830/ | grep -q '<title>Chatty Cat'
          sleep 1
          grep -qxF 'http://localhost:47830/' launcher.log
          kill -TERM "$server"
          wait "$server"
      - uses: https://github.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: chatthing
          path: chatthing-dist/*.tar.gz
          if-no-files-found: error
  publish:
    name: Publish release
    needs: [linux, mac, browser, chatthing]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: https://github.com/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          path: downloads
      - name: Create the release and upload the apps
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cloudflare in front of git.subcult.tv refuses request bodies over 100 MB, and each
          # app is larger, so uploads go to Almaz's Caddy on the LAN. That hop is plain HTTP;
          # the job token it carries expires when the job ends.
          LAN_API: http://10.0.0.200/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          mkdir assets
          find downloads -type f ! -name 'smoke-*.png' -exec mv {} assets/ \;
          (cd assets && sha256sum * > SHA256SUMS)
          short=${GITHUB_SHA::7}
          tag=desktop-$short
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          body=$(python3 - "$short" "$GITHUB_SHA" <<'EOF'
          import json, sys
          short, commit = sys.argv[1:3]
          print(json.dumps({
              'tag_name': f'desktop-{short}',
              'target_commitish': commit,
              'name': f'Chatty Cat desktop {short}',
              'body': (
                  f'Desktop app built from {short}. It runs its own chat server and renders chat in the app; '
                  'Sign in with Twitch using the app’s browser authorization link. Quitting the app signs you out.\n\n'
                  '- **macOS (Apple Silicon):** the app is ad-hoc signed, not notarized. After moving it to '
                  'Applications, open it once with right-click > Open, or run '
                  '`xattr -dr com.apple.quarantine "/Applications/Chatty Cat.app"`.\n'
                  '- **Linux (x86-64):** install the .deb, or run the AppImage. The AppImage needs FUSE '
                  '(`libfuse2`); without it, run it with `APPIMAGE_EXTRACT_AND_RUN=1`.\n\n'
                  '- **Browser build:** the browser-build archives run the chat server without the app window. '
                  'Extract the archive for your computer and run `./chatty-cat`; it opens Chatty Cat in your default '
                  'browser. Press Ctrl+C to stop it. On macOS, first run '
                  '`xattr -dr com.apple.quarantine chatthing-*-mac-arm64`.\n\n'
                  '- **Browser companion:** load the Chromium zip unpacked. The Firefox XPI is unsigned; '
                  'load it temporarily from `about:debugging#/runtime/this-firefox` in Firefox 142 or newer. '
                  'Permanent Firefox installation needs Mozilla signing.\n\n'
                  'SHA256SUMS lists the checksum of each file.'),
          }))
          EOF
          )
          # A rerun reuses the release and skips files it already holds.
          if curl -fsS -H "$auth" "$api/releases/tags/$tag" -o release.json; then
            echo "Reusing release $tag"
          else
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api/releases" -o release.json
          fi
          id=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')
          python3 -c 'import json; [print(a["name"]) for a in json.load(open("release.json"))["assets"]]' > uploaded.txt
          for file in assets/*; do
            name=$(basename "$file")
            if grep -qxF "$name" uploaded.txt; then echo "Already uploaded: $name"; continue; fi
            curl -fsS -o /dev/null -X POST -H "$auth" -H 'Host: git.subcult.tv' -F "attachment=@$file" \
              "$LAN_API/releases/$id/assets?name=$name"
            echo "Uploaded $name"
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
