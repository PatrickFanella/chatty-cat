name: Desktop
# Builds the Linux and macOS desktop apps, checks that each one starts its bundled
# server and renders live chat, and on main publishes them as a Gitea release.
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'companion/**'
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - '.go-version'
      - 'NOTICE.md'
      - 'LICENSE'
      - 'scripts/build-release.py'
      - 'scripts/build-desktop.py'
      - '.gitea/workflows/desktop.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'companion/**'
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - '.go-version'
      - 'NOTICE.md'
      - 'LICENSE'
      - 'scripts/build-release.py'
      - 'scripts/build-desktop.py'
      - '.gitea/workflows/desktop.yml'
  workflow_dispatch:
jobs:
  linux:
    name: Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Xvfb and Electron's libraries
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 \
            libxss1 libxtst6 >/dev/null
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - run: python3 scripts/build-desktop.py
      - name: Start the app and render live chat
        # The job runs as root, which Chromium's sandbox refuses.
        run: xvfb-run -a desktop/dist/linux-unpacked/chatty-cat --no-sandbox --smoke="$PWD/desktop/dist/smoke-linux.png"
      - uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/smoke-linux.png
          if-no-files-found: error
  mac:
    name: macOS app
    runs-on: macos-arm64
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - run: python3 scripts/build-desktop.py
      - name: Check the ad-hoc signature
        run: codesign --verify --deep --strict "desktop/dist/mac-arm64/Chatty Cat.app"
      - name: Start the app and render live chat
        run: '"desktop/dist/mac-arm64/Chatty Cat.app/Contents/MacOS/Chatty Cat" --smoke="$PWD/desktop/dist/smoke-mac.png"'
      - uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/smoke-mac.png
          if-no-files-found: error
  publish:
    name: Publish release
    needs: [linux, mac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: https://github.com/actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Create the release and upload the apps
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          rm -f assets/smoke-*.png
          (cd assets && sha256sum * > SHA256SUMS)
          short=${GITHUB_SHA::7}
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          body=$(python3 - "$short" "$GITHUB_SHA" <<'EOF'
          import json, sys
          short, commit = sys.argv[1:3]
          print(json.dumps({
              'tag_name': f'desktop-{short}',
              'target_commitish': commit,
              'name': f'Chatty Cat desktop {short}',
              'body': (
                  f'Desktop app built from {short}. It runs its own chat server and renders chat in the app; '
                  'Twitch login is not available in the desktop app yet.\n\n'
                  '- **macOS (Apple Silicon):** the app is ad-hoc signed, not notarized. After moving it to '
                  'Applications, open it once with right-click > Open, or run '
                  '`xattr -dr com.apple.quarantine "/Applications/Chatty Cat.app"`.\n'
                  '- **Linux (x86-64):** install the .deb, or run the AppImage. The AppImage needs FUSE '
                  '(`libfuse2`); without it, run it with `APPIMAGE_EXTRACT_AND_RUN=1`.\n\n'
                  'SHA256SUMS lists the checksum of each file.'),
          }))
          EOF
          )
          id=$(curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$api/releases" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for file in assets/*; do
            curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -F "attachment=@$file" \
              "$api/releases/$id/assets?name=$(basename "$file")"
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/desktop-$short"
